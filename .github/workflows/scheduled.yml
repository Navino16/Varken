name: Scheduled CI

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        branch: [develop, main]
    uses: Navino16/.github/.github/workflows/ci.yml@1.2.0
    with:
      ref: ${{ matrix.branch }}
      codecov: false
    secrets: inherit

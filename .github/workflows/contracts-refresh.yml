name: Contracts refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

concurrency:
  group: contracts-refresh-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BRANCH: contracts/refresh

jobs:
  # On pull requests: refresh the specs against upstream and check the PR's code still works with them.
  check:
    name: Check against upstream specs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Refresh specs
        run: npm run contracts:update -- --report "$RUNNER_TEMP/report.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        run: |
          report="$RUNNER_TEMP/report.md"
          status=0
          if [ -n "$(git status --porcelain)" ]; then
            echo "::notice::Upstream specs changed since they were pinned; the weekly refresh opens a pull request for them"
            scripts/contracts/verify-refresh.sh "$report" || status=1
          fi
          if grep -q '^## Failures' "$report"; then
            echo "::error::Some specs could not be refreshed, see the job summary"
            status=1
          fi
          if grep -q '^## Manual review' "$report"; then
            echo "::warning::A hand-written contract needs a review, see the job summary"
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Weekly (and on demand): refresh the specs on develop and open or update the dependencies pull request.
  refresh:
    name: Refresh pinned API specs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Refresh specs
        run: npm run contracts:update -- --report "$RUNNER_TEMP/report.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif grep -q '^## Failures' "$RUNNER_TEMP/report.md"; then
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Some specs could not be refreshed, see the job summary"
            exit 1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # PRs opened with GITHUB_TOKEN do not trigger ci.yml, so the verification goes into the PR body.
      - name: Verify
        if: steps.changes.outputs.changed == 'true'
        run: |
          scripts/contracts/verify-refresh.sh "$RUNNER_TEMP/report.md" || true
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bot='41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git config user.email "$bot"
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -n "$open_pr" ] && git fetch origin "$BRANCH" \
            && git log --format='%ae' "origin/develop..origin/$BRANCH" | grep -qvxF "$bot"; then
            # A maintainer pushed to the PR (e.g. a hand-written contract update): never force-push over it.
            gh pr comment "$open_pr" --body-file "$RUNNER_TEMP/report.md"
            exit 0
          fi
          git switch -c "$BRANCH"
          git add -A
          git commit -m 'chore(contracts): refresh pinned API specs'
          git push --force origin "$BRANCH"
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body-file "$RUNNER_TEMP/report.md"
          else
            gh pr create --base develop --head "$BRANCH" \
              --title 'chore(contracts): refresh pinned API specs' \
              --label dependencies \
              --body-file "$RUNNER_TEMP/report.md"
          fi

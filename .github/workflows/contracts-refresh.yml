name: Contracts refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: contracts-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: contracts/refresh

jobs:
  refresh:
    name: Refresh pinned API specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Refresh specs
        run: npm run contracts:update -- --report "$RUNNER_TEMP/report.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif grep -q '^## Failures' "$RUNNER_TEMP/report.md"; then
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Some specs could not be refreshed, see the job summary"
            exit 1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # PRs opened with GITHUB_TOKEN do not trigger ci.yml, so the verification goes into the PR body.
      - name: Verify
        if: steps.changes.outputs.changed == 'true'
        run: |
          report="$RUNNER_TEMP/report.md"
          printf '\n## Verification\n\n' >> "$report"
          check() {
            name="$1"; shift
            log="$RUNNER_TEMP/check.log"
            if "$@" > "$log" 2>&1; then
              printf -- '- %s: pass\n' "$name" >> "$report"
            else
              # Failing tests and type errors first, then the summary lines.
              details="$( { grep -E '(FAIL|×| error TS)' "$log" | sort -u | head -n 40; tail -n 8 "$log"; } )"
              printf -- '- %s: **fail**\n\n```\n%s\n```\n\n' "$name" "$details" >> "$report"
            fi
          }
          check 'tsc' npx tsc --noEmit
          check 'typecheck' npm run typecheck
          check 'tests' npx vitest run
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bot='41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git config user.email "$bot"
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -n "$open_pr" ] && git fetch origin "$BRANCH" \
            && git log --format='%ae' "origin/develop..origin/$BRANCH" | grep -qvxF "$bot"; then
            # A maintainer pushed to the PR (e.g. a hand-written contract update): never force-push over it.
            gh pr comment "$open_pr" --body-file "$RUNNER_TEMP/report.md"
            exit 0
          fi
          git switch -c "$BRANCH"
          git add -A
          git commit -m 'chore(contracts): refresh pinned API specs'
          git push --force origin "$BRANCH"
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body-file "$RUNNER_TEMP/report.md"
          else
            gh pr create --base develop --head "$BRANCH" \
              --title 'chore(contracts): refresh pinned API specs' \
              --label dependencies \
              --body-file "$RUNNER_TEMP/report.md"
          fi

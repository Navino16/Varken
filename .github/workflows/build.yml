name: Build Docker Image

on:
  workflow_dispatch:
  push:
    branches: [develop]
    tags: ['*']
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'tests/**'
      - 'scripts/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    uses: Navino16/.github/.github/workflows/ci.yml@1.1.0
    permissions:
      contents: read
    secrets: inherit

  build:
    needs: [ci]
    uses: Navino16/.github/.github/workflows/build.yml@1.1.0
    permissions:
      contents: write
      packages: write
      pull-requests: read
    with:
      release-title: Varken
      discord-role-id: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
    secrets: inherit
